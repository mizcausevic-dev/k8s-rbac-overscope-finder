apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: support-debug
  namespace: production
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/exec", "pods/portforward"]
    verbs: ["get", "list", "create"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list"]
